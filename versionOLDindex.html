<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geotab Installation Verifier</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Inline favicon (fixes 404) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .spinner { border-top-color: #3498db; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg);} }
    button:disabled { cursor: not-allowed; opacity: 0.7; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">Geotab Installation Verifier</h1>
      <p class="text-gray-400">Verify plow and spreader diagnostics post-installation.</p>
    </header>

    <!-- Login Form -->
    <div id="login-section" class="bg-gray-800 p-6 rounded-lg shadow-lg">
      <h2 class="text-xl font-semibold mb-4 text-center">API Login</h2>
      <div id="login-form" class="space-y-4">
        <input type="text" id="server" placeholder="Server (e.g., my.geotab.com)" required class="w-full bg-gray-700 text-white p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" value="my.geotab.com">
        <input type="text" id="database" placeholder="Database Name" required class="w-full bg-gray-700 text-white p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="text" id="username" placeholder="Username" required class="w-full bg-gray-700 text-white p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input type="password" id="password" placeholder="Password" required class="w-full bg-gray-700 text-white p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="button" id="login-button" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-300">Login</button>
      </div>
    </div>

    <!-- Search Section -->
    <div id="search-section" class="hidden bg-gray-800 p-6 rounded-lg shadow-lg mt-6">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold">Vehicle Lookup</h2>
        <button id="logout-button" class="text-sm text-blue-400 hover:text-blue-300">Logout</button>
      </div>
      <div id="search-form" class="flex flex-col sm:flex-row gap-3">
        <input type="text" id="vehicle-id" placeholder="Enter VIN or Serial Number" required class="flex-grow bg-gray-700 text-white p-3 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        <button type="button" id="search-button" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md transition duration-300">Fetch Details</button>
      </div>
    </div>

    <!-- Results Section -->
    <div id="results-section" class="hidden mt-6">
      <div id="loading-spinner" class="hidden flex justify-center items-center p-6">
        <div class="spinner w-12 h-12 rounded-full border-4 border-gray-600"></div>
      </div>
      <div id="error-message" class="hidden bg-red-800 p-4 rounded-lg text-center font-semibold"></div>
      <div id="results-content" class="hidden bg-gray-800 p-6 rounded-lg shadow-lg">
        <h3 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Vehicle Details</h3>
        <div id="vehicle-info" class="mb-6 text-gray-300"></div>
        <h3 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">Primary Diagnostic Status</h3>
        <div id="diagnostic-results" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    console.log("Geotab Verifier Script Started!");

    // --- Geotab API Wrapper ---
    class GeotabApi {
      constructor() {
        this.server = null;
        this.credentials = null;
      }

      async call(method, params) {
        if (!this.server) throw new Error("Server not set.");

        const finalParams = (method === 'Authenticate') ? params : { ...(params || {}), credentials: this.credentials };
        const requestBody = JSON.stringify({ method, params: finalParams });

        // ✅ Correct endpoint
        const url = `https://${this.server}/apiv1`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
          body: `JSON-RPC=${encodeURIComponent(requestBody)}`
        });

        if (!response.ok) throw new Error(`Network response was not ok: ${response.status} ${response.statusText}`);

        const data = await response.json();
        if (data.error) throw new Error(data.error.message || 'Unknown API error.');
        return data.result;
      }

      async get(typeName, params) {
        return this.call('Get', { typeName, ...(params || {}) });
      }

      async authenticate(server, database, userName, password) {
        this.server = (server || '').replace(/^https?:\/\//, '').replace(/\/+$/, '');
        this.credentials = null;
        const result = await this.call('Authenticate', { database, userName, password });
        if (result && result.credentials) {
          this.credentials = result.credentials;
          sessionStorage.setItem('geotab_creds', JSON.stringify({ server: this.server, credentials: result.credentials }));
          return result.credentials;
        }
        throw new Error('Authentication failed: Invalid credentials returned.');
      }

      logout() {
        this.credentials = null;
        this.server = null;
        sessionStorage.removeItem('geotab_creds');
      }
    }

    const api = new GeotabApi();

    // --- DOM Elements ---
    const loginSection = document.getElementById('login-section');
    const searchSection = document.getElementById('search-section');
    const resultsSection = document.getElementById('results-section');
    const loadingSpinner = document.getElementById('loading-spinner');
    const errorMessage = document.getElementById('error-message');
    const resultsContent = document.getElementById('results-content');
    const vehicleInfo = document.getElementById('vehicle-info');
    const diagnosticResults = document.getElementById('diagnostic-results');
    const loginButton = document.getElementById('login-button');
    const searchButton = document.getElementById('search-button');

    const DIAGNOSTICS_TO_CHECK = {
      'Plow': ['DiagnosticAux6Id', 'DiagnosticThirdPartyAux6Id'],
      'Wing Plow': ['DiagnosticAux7Id', 'DiagnosticThirdPartyAux7Id'],
      'Spreader Active': ['DiagnosticSolidMaterialActiveId'],
      'Spreader Rate': ['DiagnosticSolidMaterialRateId'],
      'Spreader Material': ['DiagnosticSolidMaterialTypeId']
    };

    document.addEventListener('DOMContentLoaded', () => {
      checkSession();
      loginButton.addEventListener('click', handleLogin);
      searchButton.addEventListener('click', handleSearch);
      document.getElementById('logout-button').addEventListener('click', handleLogout);
    });

    function checkSession() {
      const storedCreds = sessionStorage.getItem('geotab_creds');
      if (storedCreds) {
        try {
          const { server, credentials } = JSON.parse(storedCreds);
          if (server && credentials) {
            api.server = server;
            api.credentials = credentials;
            loginSection.classList.add('hidden');
            searchSection.classList.remove('hidden');
          }
        } catch {
          sessionStorage.removeItem('geotab_creds');
        }
      }
    }

    async function handleLogin() {
      loginButton.disabled = true;
      loginButton.textContent = 'Logging in...';
      hideError();
      resultsSection.classList.add('hidden');

      const server = document.getElementById('server').value.trim();
      const database = document.getElementById('database').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        await api.authenticate(server, database, username, password);
        loginSection.classList.add('hidden');
        searchSection.classList.remove('hidden');
      } catch (error) {
        showError(`Login Failed: ${error.message}`);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Login';
      }
    }

    function handleLogout() {
      api.logout();
      searchSection.classList.add('hidden');
      resultsSection.classList.add('hidden');
      loginSection.classList.remove('hidden');
    }

    async function handleSearch() {
      hideError();
      resultsContent.classList.add('hidden');
      resultsSection.classList.remove('hidden');
      showLoading();

      const vehicleId = document.getElementById('vehicle-id').value.trim();
      if (!vehicleId) {
        showError("Please enter a VIN or Serial Number.");
        hideLoading();
        return;
      }

      try {
        let devices = await api.get('Device', { search: { serialNumber: vehicleId } });
        if (!devices.length) devices = await api.get('Device', { search: { vehicleIdentificationNumber: vehicleId } });
        if (!devices.length) throw new Error(`No device found with VIN/Serial: "${vehicleId}"`);

        const device = devices[0];
        displayVehicleInfo(device);

        const statusData = await api.get('StatusData', { search: { deviceSearch: { id: device.id } } });
        processDiagnostics(statusData || []);
        resultsContent.classList.remove('hidden');
      } catch (error) {
        showError(`Search Failed: ${error.message}`);
      } finally {
        hideLoading();
      }
    }

    function displayVehicleInfo(device) {
      vehicleInfo.innerHTML = `
        <p><strong>Name:</strong> ${device.name}</p>
        <p><strong>VIN:</strong> ${device.vehicleIdentificationNumber || 'N/A'}</p>
        <p><strong>Serial Number:</strong> ${device.serialNumber || 'N/A'}</p>
        <p><strong>Last Communicated:</strong> ${device.lastCommunicated ? new Date(device.lastCommunicated).toLocaleString() : 'N/A'}</p>
      `;
    }

    function processDiagnostics(statusData) {
      diagnosticResults.innerHTML = '';
      const foundDataMap = new Map(statusData.map(item => [item.diagnostic.id, item]));

      for (const [name, ids] of Object.entries(DIAGNOSTICS_TO_CHECK)) {
        let foundItem = null;
        let foundId = null;
        for (const id of ids) {
          if (foundDataMap.has(id)) {
            foundItem = foundDataMap.get(id);
            foundId = id;
            break;
          }
        }
        if (foundItem) {
          diagnosticResults.innerHTML += `
            <div class="bg-gray-700 p-3 rounded-md">
              <p class="font-semibold">${name}</p>
              <p class="text-xs text-gray-400">${foundId}</p>
              <p class="text-lg">${foundItem.data}</p>
              <p class="text-xs text-gray-400">${new Date(foundItem.dateTime).toLocaleString()}</p>
            </div>`;
        } else {
          diagnosticResults.innerHTML += `
            <div class="bg-gray-700 p-3 rounded-md opacity-60">
              <p class="font-semibold">${name}</p>
              <p class="text-xs text-gray-400">${ids.join(' or ')}</p>
              <span class="px-2 py-1 text-sm bg-yellow-800 rounded">Not Found</span>
            </div>`;
        }
      }
    }

    function showLoading() { loadingSpinner.classList.remove('hidden'); }
    function hideLoading() { loadingSpinner.classList.add('hidden'); }
    function showError(msg) { errorMessage.textContent = msg; errorMessage.classList.remove('hidden'); }
    function hideError() { errorMessage.classList.add('hidden'); }
  </script>
</body>
</html>
